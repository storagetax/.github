<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1f"/>
      <stop offset="55%" stop-color="#101635"/>
      <stop offset="100%" stop-color="#1a1144"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <ellipse cx="600" cy="180" rx="600" ry="260" fill="url(#glow)"/>

  <g fill="#3b3f6d" opacity="0.35">
    <circle cx="100" cy="80"  r="2.5"/>
    <circle cx="220" cy="40"  r="1.6"/>
    <circle cx="320" cy="120" r="2.0"/>
    <circle cx="900" cy="60"  r="2.2"/>
    <circle cx="1050" cy="140" r="1.8"/>
    <circle cx="1120" cy="80" r="2.5"/>
    <circle cx="180" cy="290" r="2.0"/>
    <circle cx="60"  cy="220" r="1.8"/>
    <circle cx="1000" cy="280" r="2.2"/>
    <circle cx="1140" cy="240" r="1.6"/>
  </g>

  <text
    x="600" y="180"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="96"
    font-weight="700"
    letter-spacing="-2"
    fill="url(#title)">Storagetax</text>

  <text
    x="600" y="230"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="22"
    font-weight="400"
    letter-spacing="2"
    fill="#cbd5e1"
    opacity="0.85">REAL-TIME STORAGE RIGHT-SIZING FOR CLOUD VMs</text>

  <line x1="500" y1="265" x2="700" y2="265" stroke="#a78bfa" stroke-width="1.5" opacity="0.4"/>

  <text
    x="600" y="300"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="18"
    font-weight="300"
    fill="#94a3b8"
    opacity="0.7">pay for what you use, not what you provisioned</text>
</svg>
